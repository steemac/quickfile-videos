# Refreshes the video list from YouTube every day and commits any changes.
# Add your key under Settings > Secrets and variables > Actions > New repository secret,
# named YOUTUBE_API_KEY. Without it, the RSS feed is used (adds new videos only).
name: Update videos

on:
  schedule:
    - cron: "15 5 * * *"   # every day at 05:15 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch videos from YouTube
        run: node update-videos.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- videos.js videos.json; then
            echo "No new videos."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.js videos.json
            git commit -m "Update video list"
            git push
          fi
